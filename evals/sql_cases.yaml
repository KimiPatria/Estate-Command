  expected_sql: |
    SELECT SUM(bunches_total) AS total_bunches
    FROM t_oph
    WHERE EXTRACT(YEAR FROM oph_created_date) = 2025
      AND EXTRACT(MONTH FROM oph_created_date) IN (4, 5, 6)
      AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
  expected_tables: [t_oph]
  notes: Indonesian, quarter filter (verbatim real query)

