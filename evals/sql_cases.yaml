# Golden test set for the text-to-SQL pipeline (Bedrock migration plan #1).
#
# Seeded from real query patterns in query_history.db (131 successful queries,
# incl. the Indonesian phrasings users actually type) plus schema coverage of
# the high-traffic tables (t_oph, m_employee, t_workdone, t_attendance,
# t_harvesting_plan, m_block, m_estate).
#
# Fields per case:
#   id              stable identifier
#   query           the natural-language question, verbatim style of real users
#   expected_sql    reference SQL — executed live at eval time; the generated
#                   SQL's result ROWS are diffed against this one's ROWS
#                   (execution accuracy, not string match)
#   expected_tables tables a correct answer needs (retrieval ground truth)
#   ordered         true when row order is part of correctness (top-N cases)
#   notes           what the case probes
#
# Authoring rules:
#   * expected_sql follows business_rules.txt — the rules define correctness
#     for this deployment: t_oph time filters use oph_created_date (rule 5)
#     and tables whose DDL exposes an is_deleted column get the
#     (x_is_deleted = 0 OR x_is_deleted IS NULL) guard (rule 3).
#   * fixed date ranges only (no "last 30 days") so results are deterministic
#   * string literals in ALL CAPS (matches DB storage convention)
#   * every expected_sql must execute against the live EPMS schema — run
#     `python sql_eval.py --check-cases` after editing this file.

- id: sql_001
  query: "Total harvest in 2025"
  expected_sql: |
    SELECT SUM(bunches_total) AS total_bunches
    FROM t_oph
    WHERE EXTRACT(YEAR FROM oph_created_date) = 2025
      AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
  expected_tables: [t_oph]
  notes: simple aggregate, year filter (top real pattern)

- id: sql_002
