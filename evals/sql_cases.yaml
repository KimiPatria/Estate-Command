# NOTE on 035/036: block_code repeats across estates in m_block, so a join on
# block_code alone fans out (~18x duplication). The correct join is composite:
# block_code AND estate_code. These are deliberately the hardest cases.

- id: sql_035
  query: "harvest total per block name in 2025 (use the block master names)"
  expected_sql: |
    SELECT m_block.block_name, SUM(t_oph.bunches_total) AS total_bunches
    FROM t_oph
    JOIN m_block ON t_oph.oph_block_code = m_block.block_code
               AND t_oph.oph_estate_code = m_block.block_estate_code
    WHERE EXTRACT(YEAR FROM t_oph.oph_created_date) = 2025
      AND (t_oph.oph_is_deleted = 0 OR t_oph.oph_is_deleted IS NULL)
    GROUP BY m_block.block_name
  expected_tables: [t_oph, m_block]
  notes: composite join t_oph->m_block (hard — join on code alone fans out)

- id: sql_036
  query: "berapa rata-rata bunches per hektar per block di 2025"
  expected_sql: |
    SELECT m_block.block_code,
           SUM(t_oph.bunches_total) / NULLIF(MAX(m_block.block_hectarage), 0) AS bunches_per_ha
    FROM t_oph
    JOIN m_block ON t_oph.oph_block_code = m_block.block_code
               AND t_oph.oph_estate_code = m_block.block_estate_code
    WHERE EXTRACT(YEAR FROM t_oph.oph_created_date) = 2025
      AND (t_oph.oph_is_deleted = 0 OR t_oph.oph_is_deleted IS NULL)
    GROUP BY m_block.block_code
  expected_tables: [t_oph, m_block]
  notes: Indonesian, composite join + derived ratio (hardest stretch case)
