# Golden set for the CHAT pipeline: does the page give the right NUMBER, every time?
#
# Unlike sql_cases.yaml (compares generated SQL results to a reference at the
# SQL step) this is run through the whole /chat/message path, as a user sees it:
# table retrieval, few-shot examples, SQL writing, estate scoping, validation,
# execution, merging. Run it several times: the model is not deterministic, and
# the same question has come out with and without the deleted-rows filter.
#
#   python evals/run_golden_chat.py --check-cases          # no LLM: reference SQL sanity
#   python evals/run_golden_chat.py --runs 3               # the real test
#   python evals/run_golden_chat.py --only sd_002 --runs 5
#
# Fields
#   id, database (live | staging), category, query
#   turns          optional: messages sent first in the same chat; only the reply to
#                  `query` is scored (a conversation, e.g. ask-back then "run it")
#   rel_tol        optional relative tolerance for the figures (default exact), for
#                  ratios the model may round
#   scope          live only: all | ba | k3 (the estates the question should reach)
#   reference_sql  run on each in-scope database. Live: one row, column `value`.
#                  Staging: rows with columns `estate` and `value`. This is the
#                  expected figure; the model never writes it.
#   trap_sql       the plausible WRONG figure (same shape), e.g. the total that
#                  still counts deleted rows. If the answer matches the trap the
#                  failure is reported as "wrong figure" and named.
#   sql_must       regexes the generated SQL must match (the guard is there)
#   sql_must_not   regexes it must not match (fails the run), e.g. the approval date
#   sql_warn_not   regexes that only raise a warning (right answer, fragile SQL), e.g. a
#                  named estate turned into a WHERE on a per-estate database
#   notes          why the case exists
#
# A run passes when: the pipeline answered, every sql_must / sql_must_not holds,
# and every expected figure appears in the returned rows (exact, as a value or as
# a column total, so monthly rows summing to the total are fine).
#
# Rules the reference SQL follows (business_rules.txt): rule 3 is_deleted guard,
# rule 5 oph_created_date. Fixed dates, except cases that test the default period
# (no period in the question), which use the same GETDATE() window as the rule.

# ── live databases (BA + K3): deleted rows ─────────────────────────────────

- id: sd_001
  database: live
  category: soft_delete
  scope: all
  query: "Total harvest in 2025"
  reference_sql: |
    SELECT SUM(bunches_total) AS value FROM t_oph
    WHERE EXTRACT(YEAR FROM oph_created_date) = 2025
      AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
  trap_sql: |
    SELECT SUM(bunches_total) AS value FROM t_oph
    WHERE EXTRACT(YEAR FROM oph_created_date) = 2025
  sql_must: ['oph_is_deleted', 'oph_created_date']
  notes: "the plain case. Deleted tickets are 0.1 to 0.5 percent of the total."
  sql_must_not: ['oph_approved_date']

