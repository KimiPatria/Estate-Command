      WHERE PRFNR IS NOT NULL AND BUDAT >= '2026-10-01' AND BUDAT < '2026-11-01' GROUP BY PRFNR
  notes: "the same in Bahasa Indonesia"

- id: ov_003
  database: live
  category: overview
  kind: overview
  scope: all
  query: "How did the estates perform in 2025?"
  rel_tol: 0.01
  measures:
    ripe_bunches: |
      SELECT SUM(bunches_ripe) AS value FROM t_oph
      WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
        AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
    total_bunches: |
      SELECT SUM(bunches_total) AS value FROM t_oph
      WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
        AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
    ripeness_rate: |
      SELECT SUM(bunches_ripe) * 100.0 / NULLIF(SUM(bunches_total), 0) AS value FROM t_oph
      WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
        AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
    overripe_pct: |
      SELECT SUM(bunches_overripe) * 100.0 / NULLIF(SUM(bunches_total), 0) AS value FROM t_oph
      WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
        AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
    bunches_per_ha: |
      SELECT h.b / NULLIF(a.ha, 0) AS value
      FROM (SELECT SUM(bunches_total) AS b FROM t_oph
            WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
              AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)) h
      CROSS JOIN (SELECT SUM(block_hectarage)::numeric AS ha FROM m_block WHERE block_state = 'MATURE') a
    loose_fruit: |
      SELECT SUM(loose_fruits) AS value FROM t_oph
      WHERE oph_created_date >= DATE '2025-01-01' AND oph_created_date < DATE '2026-01-01'
        AND (oph_is_deleted = 0 OR oph_is_deleted IS NULL)
    mandays: |
      SELECT SUM(workdone_mandays) AS value FROM t_workdone
      WHERE workdone_date >= DATE '2025-01-01' AND workdone_date < DATE '2026-01-01'
    overtime: |
      SELECT SUM(overtime_duration) AS value FROM t_overtime
      WHERE overtime_date >= DATE '2025-01-01' AND overtime_date < DATE '2026-01-01'
  notes: "live: each estate is its own database, so each measure is one figure per database, merged on the estate"

