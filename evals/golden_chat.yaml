# ── broad questions: the overview planner (chat_overview.py) ──────────────
#
# kind: overview. The planner picks 2 to 4 measures, so the case holds a
# reference query per measure it may pick (`measures`: id -> SQL with the same
# shape as reference_sql). Each measure the answer shows is checked in its own
# column of the merged table; at least two must be checked and all must match.
#   expect_route: clarify   the question must still be asked back (a ranking)
#   check: structure        only the shape is checked: the overview route, at least
#                           two measures with rows, one merged table

- id: ov_001
  database: staging
  category: overview
  kind: overview
  query: "How did the estates perform in September 2026?"
  rel_tol: 0.01
  measures:
    ripe_bunches: |
      SELECT e.NAME1 AS estate, SUM(CAST(o.ZMASAK AS decimal(18,2))) AS value
      FROM OPH o JOIN EST e ON e.WERKS = o.WERKS AND e.KDATE = '9999-12-31'
      WHERE o.BUDAT >= '2026-09-01' AND o.BUDAT < '2026-10-01' GROUP BY e.NAME1
    tonnes_delivered: |
      SELECT e.NAME1 AS estate, SUM(t.w) / 1000.0 AS value
      FROM (SELECT ESTNR, SPB, MAX(WB_QTY_TOTAL) AS w FROM FDN
            WHERE BUDAT >= '2026-09-01' AND BUDAT < '2026-10-01' GROUP BY ESTNR, SPB) t
      JOIN EST e ON e.ESTNR = t.ESTNR AND e.KDATE = '9999-12-31'
      WHERE t.w > 0 GROUP BY e.NAME1
    loose_fruit: |
      SELECT e.NAME1 AS estate, SUM(TRY_CAST(o.ZBRONDOLAN AS decimal(18,2))) AS value
      FROM OPH o JOIN EST e ON e.WERKS = o.WERKS AND e.KDATE = '9999-12-31'
      WHERE o.BUDAT >= '2026-09-01' AND o.BUDAT < '2026-10-01' GROUP BY e.NAME1
    bunches_per_ha: |
      SELECT e.NAME1 AS estate, h.b / a.ha AS value
      FROM (SELECT WERKS, SUM(CAST(ZMASAK AS decimal(18,2))) AS b FROM OPH
            WHERE WERKS IS NOT NULL AND BUDAT >= '2026-09-01' AND BUDAT < '2026-10-01' GROUP BY WERKS) h
      JOIN (SELECT ESTNR, SUM(BHA) AS ha FROM BLK WHERE KDATE = '9999-12-31' GROUP BY ESTNR) a
        ON a.ESTNR = RIGHT(h.WERKS, 2)
      JOIN EST e ON e.WERKS = h.WERKS AND e.KDATE = '9999-12-31'
    harvester_output: |
      SELECT e.NAME1 AS estate, AVG(d.b) AS value
      FROM (SELECT WERKS, EMPNR, BUDAT, SUM(CAST(ZMASAK AS decimal(18,2))) AS b FROM OPH
            WHERE WERKS IS NOT NULL AND BUDAT >= '2026-09-01' AND BUDAT < '2026-10-01'
            GROUP BY WERKS, EMPNR, BUDAT) d
      JOIN EST e ON e.WERKS = d.WERKS AND e.KDATE = '9999-12-31' GROUP BY e.NAME1
    mandays: |
      SELECT e.NAME1 AS estate, SUM(g.HKINP) AS value
      FROM GWO g JOIN EST e ON e.WERKS = g.WERKS AND e.KDATE = '9999-12-31'
      WHERE g.BUDAT >= '2026-09-01' AND g.BUDAT < '2026-10-01' GROUP BY e.NAME1
    absence: |
      SELECT REPLACE(PRFNR, 'ESTATE PLASMA', 'PLASMA') AS estate, COUNT(*) AS value FROM ATD
      WHERE ATDCD = 'M' AND PRFNR IS NOT NULL AND BUDAT >= '2026-09-01' AND BUDAT < '2026-10-01'
      GROUP BY PRFNR
    overtime: |
      SELECT REPLACE(PRFNR, 'ESTATE PLASMA', 'PLASMA') AS estate, SUM(NHOUR) AS value FROM OVT
      WHERE PRFNR IS NOT NULL AND BUDAT >= '2026-09-01' AND BUDAT < '2026-10-01' GROUP BY PRFNR
  notes: "a broad question across estates with a named month: every measure shown must be the database's figure, side by side per estate"

