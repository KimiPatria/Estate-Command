# Leak diagnosis eval cases (buildplan_finance.md §5).
#
# One case per planted leak and per decoy unit. `key` names the row in
# gis/data/synthetic/ec_fi_leak_key.csv whose true_cause the case is scored
# against; the runner reads it there, so the answer lives in one place.
# Decoys pass on "within_norm", or on a cause held only as "possible".
#
# Run: python evals/run_leak_diagnosis.py [--runs 3]

cases:
