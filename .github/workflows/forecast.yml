# Forecast pipeline CI (buildplan_forecast_mlops.md Phase 7.1).
#
# Runs on synthetic estates only (forecast/fixtures/make_synthetic.py): no company
# data ever enters CI, and the job fails if any data folder is tracked in git.
# The whole refresh runs end to end -- both source adapters, the contract and gate,
# the Lab build with a stub model run in place of Chronos, the Chronos-only
# selection, the health check, publish, the comparison payload and the monitors.
name: forecast

on:
  push:
  pull_request:

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: No company data is tracked
        run: |
          tracked="$(git ls-files forecast/staging forecast/live forecast/runs forecast/experiments gis/data/estates)"
          if [ -n "$tracked" ]; then echo "company data is tracked:"; echo "$tracked"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-forecast-ci.txt

      - name: Install
        run: pip install -r requirements-forecast-ci.txt

      - name: Lint (errors only)
        run: >
          ruff check --select E9,F63,F7,F82
          forecast/ forecast_sources.py forecast_compare.py forecast_router.py experiment_router.py

      - name: Tests
        run: >
          python -m pytest -q
          test_forecast_contract.py test_forecast_bands.py test_forecast_refresh.py
          test_forecast_ci_pipeline.py test_forecast_theme.py test_forecast_chronos_serving.py
          test_forecast_compare.py test_forecast_precompute.py test_forecast_seasadj.py
