<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPMS AI Chat</title>
<script>
  // Theme before first paint, so a dark-mode user never sees a white flash.
  (function () {
    var t = null;
    try { t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('chat-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
    try {
      if (localStorage.getItem('chat-sidebar') === 'closed') document.documentElement.classList.add('sb-closed');
    } catch (e) {}
  })();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23115e6e'/%3E%3Cpath d='m16 6 2.5 7.4L26 15.3l-7.5 2.5L16 25.3l-2.5-7.5L6 15.3l7.5-1.9Z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/chat-static/chat.css?v=4">
</head>
<body>

<div class="app">
  <!-- ── sidebar: chats ─────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar" aria-label="Chats">
    <div class="sb-top">
      <a class="brand" href="/chat" aria-label="EPMS AI, new chat">
        <span class="brand-mark" data-ico="spark"></span><span>EPMS AI</span>
      </a>
      <button class="icon-btn" id="sb-close" data-ico="sidebar" aria-label="Close sidebar" title="Close sidebar"></button>
    </div>
    <button class="sb-new" id="new-chat">
      <span data-ico="plus"></span><span>New chat</span><kbd>Ctrl Shift O</kbd>
    </button>
    <label class="sb-search">
      <span data-ico="search"></span>
      <input id="chat-search" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats">
      <kbd>Ctrl K</kbd>
    </label>
    <nav class="sb-list" id="session-list" aria-label="Chat history"></nav>
    <nav class="sb-pages" aria-label="Pages">
      <a href="/report"><span data-ico="report"></span><span>Report</span></a>
      <a href="/forecast"><span data-ico="forecast"></span><span>Forecast</span></a>
    </nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ── main column ────────────────────────────────────────────────── -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="sb-open" data-ico="sidebar" aria-label="Open sidebar" title="Open sidebar"></button>
      <nav class="top-pages" aria-label="Pages">
        <a class="icon-btn" href="/report" data-ico="report" aria-label="Report" title="Report"></a>
        <a class="icon-btn" href="/forecast" data-ico="forecast" aria-label="Forecast" title="Forecast"></a>
      </nav>
      <div class="chat-title" id="chat-title">New chat</div>
      <div class="top-right">
        <button class="icon-btn" id="theme-btn" aria-label="Switch theme" title="Switch theme"></button>
      </div>
    </header>

    <div class="scroller" id="scroller">
      <div class="thread" id="thread" role="log" aria-label="Conversation"></div>
    </div>

    <div class="dock">
      <button class="to-bottom" id="to-bottom" data-ico="arrow-down" aria-label="Scroll to latest" hidden></button>
      <div class="edit-banner" id="edit-banner" hidden>
        <span data-ico="pencil"></span><span>Editing your last message</span>
        <button id="edit-cancel" class="link-btn">Cancel</button>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="msg-input" rows="1" placeholder="Ask about your estates…" aria-label="Message"></textarea>
        <div class="composer-row">
          <button type="button" class="pill-btn" id="tools-btn" aria-haspopup="dialog" aria-expanded="false">
            <span data-ico="sliders"></span><span>Tools</span>
          </button>
          <div class="chips" id="ctx-chips"></div>
          <button type="submit" class="send" id="send-btn" aria-label="Send message" disabled></button>
        </div>
        <div class="popover" id="tools-pop" role="dialog" aria-label="Tools" hidden></div>
      </form>
      <p class="fine">AI-generated from your EPMS data. Check important figures.</p>
    </div>
  </div>
</div>

<div class="menu" id="menu" role="menu" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script src="/chat-static/vendor/marked.min.js"></script>
<script src="/chat-static/vendor/purify.min.js"></script>
<script src="/chat-static/vendor/chart.umd.min.js"></script>
<script src="/chat-static/chat.js?v=5"></script>
</body>
</html>
